<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">Photo Gallery</h1>

<div id="gallery" class="gallery-grid"></div>

<div id="modal" class="modal">
    <span id="close" class="close">&times;</span>
    <img id="modal-image" class="modal-content">
</div>

<script>
async function loadGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "<p>Loading photos...</p>";

    const repoOwner = "RohitkuDwivedi";
    const repoName = "RohitKuDwivedi.github.io";

    try {
        const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/photos`;

        const response = await fetch(apiURL);
        const files = await response.json();

        gallery.innerHTML = "";

        for (let file of files) {

            if (file.type !== "file") continue;

            const name = file.name;

            if (!name.match(/\.(jpeg|jpg|png|gif|webp)$/i)) continue;

            const itemDiv = document.createElement("div");
            itemDiv.className = "gallery-item";

            const img = document.createElement("img");

            img.src = file.download_url;
            img.alt = name;

            itemDiv.appendChild(img);

            itemDiv.onclick = () => openModal(file.download_url);

            gallery.appendChild(itemDiv);
        }

    } catch (error) {
        gallery.innerHTML = "<p>Error loading gallery</p>";
    }
}

function openModal(image) {
    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modal-image");

    modal.style.display = "block";
    modalImage.src = image;
}

document.getElementById("close").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

window.onclick = (event) => {
    const modal = document.getElementById("modal");
    if (event.target === modal) {
        modal.style.display = "none";
    }
};

loadGallery();
</script>

</body>
</html>
