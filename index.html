<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">Photo Gallery</h1>

<div id="gallery"></div>

<div id="modal" class="modal">
    <span id="close" class="close">&times;</span>
    <img id="modal-image" class="modal-content">
</div>

<script>
async function loadGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "<p>Loading photos...</p>";

    const repoOwner = "RohitkuDwivedi";
    const repoName = "RohitKuDwivedi.github.io";

    try {
        const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/photos`;
        const response = await fetch(apiURL);
        const files = await response.json();

        gallery.innerHTML = "";

        let images = [];

        for (let file of files) {
            if (file.type !== "file") continue;

            const name = file.name;

            if (!name.match(/\.(jpeg|jpg|png|gif|webp)$/i)) continue;

            // Fetch latest commit info to get upload date
            const commitURL = `https://api.github.com/repos/${repoOwner}/${repoName}/commits?path=photos/${name}&per_page=1`;

            const commitResponse = await fetch(commitURL);
            const commitData = await commitResponse.json();

            let date = new Date();

            if (commitData.length > 0) {
                date = new Date(commitData[0].commit.author.date);
            }

            images.push({
                name,
                url: file.download_url,
                date
            });
        }

        // Group images by YYYY-MM
        const groups = {};

        for (let img of images) {
            const ym = img.date.getFullYear() + "-" + 
                       String(img.date.getMonth() + 1).padStart(2, '0');

            if (!groups[ym]) groups[ym] = [];

            groups[ym].push(img);
        }

        // Sort months descending (newest first)
        const sortedMonths = Object.keys(groups).sort().reverse();

        const monthNames = [
            "January","February","March","April","May","June",
            "July","August","September","October","November","December"
        ];

        for (let monthKey of sortedMonths) {

            const [year, month] = monthKey.split("-");
            const monthIndex = parseInt(month) - 1;

            const sectionTitle = document.createElement("div");
            sectionTitle.className = "month-section";
            sectionTitle.textContent = monthNames[monthIndex] + " " + year;

            gallery.appendChild(sectionTitle);

            const grid = document.createElement("div");
            grid.className = "month-grid";

            for (let img of groups[monthKey]) {

                const itemDiv = document.createElement("div");
                itemDiv.className = "gallery-item";

                const imageEl = document.createElement("img");
                imageEl.src = img.url;
                imageEl.alt = img.name;

                itemDiv.appendChild(imageEl);

                itemDiv.onclick = () => openModal(img.url);

                grid.appendChild(itemDiv);
            }

            gallery.appendChild(grid);
        }

    } catch (error) {
        gallery.innerHTML = "<p>Error loading gallery</p>";
    }
}

function openModal(image) {
    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modal-image");

    modal.style.display = "block";
    modalImage.src = image;
}

document.getElementById("close").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

window.onclick = (event) => {
    const modal = document.getElementById("modal");
    if (event.target === modal) {
        modal.style.display = "none";
    }
};

loadGallery();
</script>

</body>
</html>
